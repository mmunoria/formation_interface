name: hover_low
description: >
  Point-hold smoke test: climb to a fixed altitude above home and hold. No
  formation offset - this is a single-drone flight profile, not tied to any
  particular swarm shape.
version: 1
state: OFFBOARD
control_scheme: position
params:
  altitude: 1.5
  position_tolerance: 0.15
  settle_cycles: 10
  goal_timeout: 60.0
  yaw: 0.0
trajectory:
  type: static_point
  offset: [0.0, 0.0, 1.5]
required_capabilities: []
